[package]
name = "subclave-proxy"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
publish = false
autobins = false

[lib]
name = "subclave_proxy"
path = "src/lib.rs"

[[bin]]
name = "subclave-proxy"
path = "src/main.rs"

[dependencies]
serde_json = "1"

# The fallback socket path carries the current uid and the accept-side check
# compares it with `geteuid`, both of which are libc calls on Unix.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_Security_Authorization"
] }
