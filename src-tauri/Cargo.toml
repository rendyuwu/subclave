[workspace]
# `subclave-proxy` is the native messaging host built as a sidecar; keeping the
# `[profile.*]` tables in this root manifest applies them to the member.
members = ["subclave-proxy"]
resolver = "2"

[package]
name = "subclave"
version = "0.1.1"
description = "Subclave - a local-first desktop password manager."
authors = ["rendyuwu"]
license = "Apache-2.0"
repository = "https://github.com/rendyuwu/subclave"
homepage = "https://github.com/rendyuwu/subclave"
readme = "../README.md"
edition = "2021"
# Tauri-action invokes `cargo build` without `--bin` and asks Cargo which
# binary to bundle. With the implicit bin (from package.name = "subclave" +
# src/main.rs) plus the explicit `[[bin]] SubclaveApp` pointing to the same
# source, Cargo can refuse with "failed to find main binary". Pinning
# default-run resolves it deterministically.
default-run = "SubclaveApp"
# Disable auto-discovery so the implicit `subclave` bin (from package.name +
# src/main.rs) does not collide with the explicit `[[bin]] SubclaveApp` that
# also points to src/main.rs.
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "subclave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Main GUI binary. `windows_subsystem = "windows"` (set in main.rs) detaches
# stdio on Windows.
[[bin]]
name = "SubclaveApp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Global allocator. The default Windows system heap retains freed commit on
# bursty, fragmented workloads, so a heavy-output burst inflates the process
# commit to multiple GB and it never recedes. mimalloc decommits freed segments
# back to the OS on its purge timer, turning that high-watermark back into
# transient peaks. See the `#[global_allocator]` in allocator.rs.
mimalloc = "0.1"
# Already in the tree as mimalloc's own dependency; taken directly for
# `mi_collect`, which is what actually hands freed commit back to the OS. See
# `purge_allocator` in allocator.rs.
libmimalloc-sys = { version = "0.1", features = ["extended"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# `tauri::generate_context!` expands to code that names `serde_json` at the
# crate root, so the macro needs it as a direct dependency here even though no
# module in this crate imports it.
serde_json = "1"
base64 = "0.22"
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"

# Vault crypto. `ring` for AES-256-GCM, HMAC and the system RNG; `zeroize` for
# scrubbing key material and decrypted payloads on drop. Tervia carries both as
# transitive dependencies; this promotes them to direct use.
ring = "0.17"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
# Argon2id for the vault file, the sync keyfile and backups. Default features
# off, `alloc` and `zeroize` on. `hash_password_into` is the only API used
# here; the password-hashing convenience API is not, though `alloc` still
# pulls its supporting crates.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
# zxcvbn for the strength meter. Default features off drops `derive_builder`;
# the score and feedback APIs used in `strength.rs` do not need it.
zxcvbn = { version = "3", default-features = false }
# Sync providers. `rustls-no-provider`, not `rustls`: that feature pulls
# aws-lc-rs, which needs NASM on Windows.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
# The TLS provider reqwest's `rustls-no-provider` feature deliberately does not
# install, named directly so the process can install it (see
# `ensure_crypto_provider` in `src-tauri/src/modules/sync/providers/mod.rs`).
# `ring` is the provider the rest of the graph already builds rustls with, so
# this adds no crate to the build.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# The sync providers' dates and the import group's local date. `chrono` is the
# calendar under `amz_date` and the two strict parsers in
# `src-tauri/src/modules/sync/providers/sigv4.rs` and
# `src-tauri/src/modules/sync/providers/webdav/dav_time.rs`. `alloc` for the
# two parsers, and `clock` for the local date in the import group name
# (`chrono::Local`); `wasmbind` exists for a target this app does not build for.
chrono = { version = "0.4", default-features = false, features = ["alloc", "clock"] }
# CSV import and export: KeePassXC, Bitwarden, Chrome and Firefox files.
csv = "1"
# The two listing scans, in `src-tauri/src/modules/sync/providers/s3/list_xml.rs`
# and `src-tauri/src/modules/sync/providers/webdav/dav_xml.rs`. Already in the
# tree through plist and wayland-scanner. Its default feature set is empty; the
# one feature it has, `encoding`, would pull a charset converter for a body the
# caller has already decoded from UTF-8.
quick-xml = "0.41"
# Hex, for the two folds it replaces: `hex` in
# `src-tauri/src/modules/sync/providers/sigv4.rs` and `object_name` in
# `src-tauri/src/modules/sync/crypto.rs`. Already in the tree through zbus.
hex = "0.4"
# Already in the tree through tauri, so taking it directly adds no crate to the
# build. The sync engine's test fake locks and immediately unwraps, where a
# poisoning error path is pure ceremony; `[dev-dependencies]` is not available
# to this crate, so the dependency lives here. `SyncState` keeps `std::sync`:
# its lock is held across an async boundary the fake's never is, and it reports
# a poison rather than unwrapping one.
parking_lot = "0.12"
# The sync providers' async runtime surface: `spawn_blocking` for the KDF and
# the vault writes, `sync` for the engine's own primitives. `net` and `io-util`
# are the browser socket server's Unix listener and its async frame reads.
tokio = { version = "1", features = [
	"rt-multi-thread",
	"macros",
	"sync",
	"time",
	"net",
	"io-util",
] }
# Base32 for TOTP secrets.
data-encoding = "2"
# URL parsing for TOTP otpauth URIs and entry host extraction.
url = "2"
# Registrable-domain lookup for the browser matcher's `match: "domain"` mode.
# Compiles Mozilla's list including the private section, so `a.github.io` and
# `b.github.io` are different registrable domains.
psl = "2"
# The native messaging sidecar, plus its frame codec and socket path, which the
# app's browser module shares so the wire format has one definition.
subclave-proxy = { path = "subclave-proxy" }
# `wayland-data-control` is not a default and is kept for wlroots and COSMIC,
# where it is the only clipboard path. arboard tries Wayland when
# `WAYLAND_DISPLAY` is set, warns on failure and falls back to X11.
# `image-data` stays off: only text is copied through this module.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

# Boot-time clock calls (CLOCK_BOOTTIME / CLOCK_MONOTONIC) on Unix. Already in
# the lockfile as a transitive dependency; promoted for the direct calls in
# `vault/lock.rs`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Security_Authorization",
	"Win32_Security_Cryptography",
	"Win32_Storage_FileSystem",
	"Win32_System_Console",
	"Win32_System_Diagnostics_ToolHelp",
	"Win32_System_JobObjects",
	"Win32_System_Registry",
	"Win32_System_SystemInformation",
	"Win32_System_Threading",
	"Win32_Graphics_Dwm",
	"Win32_Graphics_Gdi",
	"Win32_UI_WindowsAndMessaging",
] }
# WebView2 settings interop: `disable_browser_accelerator_keys` reaches for
# `ICoreWebView2Settings3` so the app shell owns Ctrl+W / Ctrl+N / Ctrl+R rather
# than the embedded browser. Versions match the copies wry already pulls in, so
# no duplicate crates are added.
webview2-com = "0.38"
windows = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_System_Memory",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = "symbols"
