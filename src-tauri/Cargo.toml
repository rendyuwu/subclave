[package]
name = "subclave"
version = "0.1.0"
description = "Subclave - a local-first desktop password manager."
authors = ["rendyuwu"]
license = "Apache-2.0"
repository = "https://github.com/rendyuwu/subclave"
homepage = "https://github.com/rendyuwu/subclave"
readme = "../README.md"
edition = "2021"
# Tauri-action invokes `cargo build` without `--bin` and asks Cargo which
# binary to bundle. With the implicit bin (from package.name = "subclave" +
# src/main.rs) plus the explicit `[[bin]] SubclaveApp` pointing to the same
# source, Cargo can refuse with "failed to find main binary". Pinning
# default-run resolves it deterministically.
default-run = "SubclaveApp"
# Disable auto-discovery so the implicit `subclave` bin (from package.name +
# src/main.rs) does not collide with the explicit `[[bin]] SubclaveApp` that
# also points to src/main.rs.
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "subclave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Main GUI binary. `windows_subsystem = "windows"` (set in main.rs) detaches
# stdio on Windows.
[[bin]]
name = "SubclaveApp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Global allocator. The default Windows system heap retains freed commit on
# bursty, fragmented workloads, so a heavy-output burst inflates the process
# commit to multiple GB and it never recedes. mimalloc decommits freed segments
# back to the OS on its purge timer, turning that high-watermark back into
# transient peaks. See the `#[global_allocator]` in lib.rs.
mimalloc = "0.1"
# Already in the tree as mimalloc's own dependency; taken directly for
# `mi_collect`, which is what actually hands freed commit back to the OS. See
# `purge_allocator` in lib.rs.
libmimalloc-sys = { version = "0.1", features = ["extended"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# `tauri::generate_context!` expands to code that names `serde_json` at the
# crate root, so the macro needs it as a direct dependency here even though no
# module in this crate imports it.
serde_json = "1"
base64 = "0.22"
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Security_Cryptography",
	"Win32_Storage_FileSystem",
	"Win32_System_Console",
	"Win32_System_Diagnostics_ToolHelp",
	"Win32_System_JobObjects",
	"Win32_System_Threading",
	"Win32_Graphics_Dwm",
	"Win32_Graphics_Gdi",
	"Win32_UI_WindowsAndMessaging",
] }
# WebView2 settings interop: `disable_browser_accelerator_keys` reaches for
# `ICoreWebView2Settings3` so the app shell owns Ctrl+W / Ctrl+N / Ctrl+R rather
# than the embedded browser. Versions match the copies wry already pulls in, so
# no duplicate crates are added.
webview2-com = "0.38"
windows = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_System_Memory",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = "symbols"
