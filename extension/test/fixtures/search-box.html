<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Search box before a password-only form</title>
  </head>
  <body>
    <!-- A formless header search box before a form that holds only a password:
         the search box is no username partner. -->
    <input id="search" type="text" placeholder="Search" />
    <form>
      <input id="password" type="password" autocomplete="current-password" />
      <button type="submit">Unlock</button>
    </form>
  </body>
</html>
