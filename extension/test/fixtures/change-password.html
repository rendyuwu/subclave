<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Change password</title>
  </head>
  <body>
    <form id="change">
      <input id="username" type="text" autocomplete="username" />
      <input id="current" type="password" autocomplete="current-password" />
      <input id="new" type="password" autocomplete="new-password" />
      <input id="repeat" type="password" autocomplete="new-password" />
      <button id="submit" type="submit">Change password</button>
      <button id="toggle">Show</button>
    </form>
    <script>
      // A successful in-place change clears the form.
      document.getElementById("change").addEventListener("submit", (event) => {
        event.preventDefault();
        event.target.reset();
      });
      // A show-password toggle without `type="button"`: a submit-type button
      // whose click signs nothing in.
      document.getElementById("toggle").addEventListener("click", (event) => {
        event.preventDefault();
        const field = document.getElementById("new");
        field.type = field.type === "password" ? "text" : "password";
      });
    </script>
  </body>
</html>
