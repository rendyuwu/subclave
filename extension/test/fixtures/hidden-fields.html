<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hidden fields</title>
  </head>
  <body>
    <form>
      <!-- A decoy before the username, as Booking.com has: laid out and
           opaque, but out of the tab order and the accessibility tree. -->
      <div aria-hidden="true">
        <input id="decoy-password" type="password" tabindex="-1" />
      </div>
      <input id="username" type="text" autocomplete="username" />
      <input id="hidden-password" type="password" style="display: none" />
      <input
        id="zero-password"
        type="password"
        style="width: 0; height: 0; padding: 0; border: 0"
      />
      <input id="password" type="password" autocomplete="current-password" />
    </form>
    <script>
      window.__events = { "hidden:input": 0, "zero:change": 0 };
      document.getElementById("hidden-password").addEventListener("input", () => {
        window.__events["hidden:input"] += 1;
      });
      document.getElementById("zero-password").addEventListener("change", () => {
        window.__events["zero:change"] += 1;
      });
    </script>
  </body>
</html>
