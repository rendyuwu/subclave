<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Autofocus login</title>
  </head>
  <body>
    <form>
      <input id="username" type="text" autocomplete="username" autofocus />
      <input id="password" type="password" autocomplete="current-password" />
      <button type="submit">Sign in</button>
    </form>
  </body>
</html>
