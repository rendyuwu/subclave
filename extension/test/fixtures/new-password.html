<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>New password forms</title>
  </head>
  <body>
    <!-- Form A is a sign-up form by its autocomplete token alone; form B by its
         two password inputs alone. -->
    <form id="a">
      <input id="a-username" type="text" autocomplete="username" />
      <input id="a-password" type="password" autocomplete="new-password" />
    </form>
    <form id="b">
      <input id="b-username" type="text" autocomplete="username" />
      <input id="b-password" type="password" />
      <input id="b-confirm" type="password" />
    </form>
  </body>
</html>
